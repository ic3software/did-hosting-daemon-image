name: Build & Push DID Hosting Daemon Image

on:
  workflow_dispatch:
    inputs:
      did_hosting_daemon_version:
        description: "DID Hosting Daemon version"
        required: true
        default: "0.7.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/did-hosting-daemon

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: DID_HOSTING_DAEMON_VERSION=${{ inputs.did_hosting_daemon_version }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.did_hosting_daemon_version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
